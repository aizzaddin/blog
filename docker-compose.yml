# Runs the blog in a container against your existing Postgres database.
#   1. Put DATABASE_URL (and optionally TRUST_PROXY, SITE_NAME) in a .env file next to this one.
#      Inside a container "localhost" is the container itself: for a database on this machine use
#      host.docker.internal instead, e.g. postgresql://user:pass@host.docker.internal:5432/blog
#   2. docker compose up -d --build
#   3. docker compose exec app npm run set-password
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      # How many proxies (e.g. Nginx, Caddy, a load balancer) sit in front of the app.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SITE_NAME: ${SITE_NAME:-wildanaizzaddin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/public/uploads

volumes:
  uploads:
